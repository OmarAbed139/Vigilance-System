<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروع اليقظة | التفعيل</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #000;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
        }

        #game-container {
            width: 90%;
            max-width: 450px;
            border: 1px solid #00ff41;
            padding: 25px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.4);
            background: rgba(0, 0, 0, 0.9);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 { font-size: 1.3rem; margin-bottom: 20px; text-shadow: 0 0 8px #00ff41; border-bottom: 1px solid #00ff41; padding-bottom: 10px; }
        .hidden { display: none !important; }
        
        .btn {
            background: #00ff41;
            color: #000;
            border: none;
            padding: 12px;
            width: 100%;
            margin-top: 15px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-choice {
            background: transparent;
            color: #00ff41;
            border: 1px solid #00ff41;
            margin-top: 10px;
        }

        .btn:hover { background: #fff; color: #000; box-shadow: 0 0 10px #fff; }
        
        .question-text { font-size: 1.1rem; line-height: 1.5; margin-bottom: 25px; color: #fff; min-height: 60px; }
        
        input[type="text"] {
            background: rgba(0, 255, 65, 0.1);
            border: 1px solid #333;
            border-bottom: 2px solid #00ff41;
            color: #fff;
            width: 100%;
            padding: 12px;
            outline: none;
            text-align: center;
            font-size: 1.2rem;
        }

        #custom-alert {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .alert-box {
            width: 85%;
            max-width: 320px;
            border: 1px solid #ff4141;
            background: #000;
            padding: 25px;
            text-align: center;
            box-shadow: 0 0 15px rgba(255, 65, 65, 0.5);
        }
        .alert-box.success { border-color: #00ff41; box-shadow: 0 0 15px rgba(0, 255, 65, 0.5); }
    </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<div id="game-container">
    <div id="login-screen">
        <h1>[ نظام اليقظة: الدخول ]</h1>
        <p>أدخل الرمز السري لبدء التزامن</p>
        <input type="text" id="client-code" maxlength="4" placeholder="----">
        <button class="btn" onclick="withSound(checkLogin)">تحقق من الهوية</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <h1>[ اختبار النمط ]</h1>
        <div id="question-content" class="question-text"></div>
        <div id="options-container">
            <button class="btn btn-choice" id="btn-a" onclick="withSound(() => handleAnswer('A'))"></button>
            <button class="btn btn-choice" id="btn-b" onclick="withSound(() => handleAnswer('B'))"></button>
        </div>
    </div>

    <div id="result-screen" class="hidden">
        <h1>[ تم تحليل الملف ]</h1>
        <p id="role-display" style="color: #fff; font-size: 1.3rem; margin-bottom: 10px;"></p>
        <p>القوة: <span id="power" style="color: #00ff41;"></span></p>
        <p>الضعف: <span id="weakness" style="color: #ff4141;"></span></p>
        <button class="btn" onclick="withSound(showMission)">استلام المهمة الأولى</button>
    </div>

    <div id="mission-screen" class="hidden">
        <h1>[ المهمة: ملاحظة ما تتجاهله ]</h1>
        <p>الهدف: مسجد شيخة الحسن</p>
        <p style="font-size: 0.85rem; color: #aaa; margin-bottom: 15px;">ابحث عن التاريخ الهجري في أعلى يمين لافتة المسجد الرئيسية</p>
        <input type="text" id="mission-input" placeholder="أدخل السنة الهجرية">
        <button class="btn" onclick="withSound(verifyMission)">تأكيد التنفيذ</button>
    </div>
</div>

<div id="custom-alert" class="hidden">
    <div class="alert-box" id="alert-box">
        <p id="alert-msg" style="line-height: 1.4;"></p>
        <button class="btn" onclick="withSound(closeAlert)">إغلاق</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const chars = "01";
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#00ff41";
        ctx.font = fontSize + "px 'Courier New'";
        for (let i = 0; i < drops.length; i++) {
            const text = chars.charAt(Math.floor(Math.random() * chars.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 50);

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 440, duration = 0.1) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "square";
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function withSound(fn) {
        playBeep(600, 0.05);
        fn();
    }

    const CONFIG = { loginCode: "2007", missionCode: "1437" };
    let currentQ = 0, score = 0;

    const questions = [
        { q: "أنت مراقب، هل ترغب بمواجهة من يراقبك أم تفضل الهروب؟", choiceA: "هروب", choiceB: "مواجهة" },
        { q: "أنت وصديقك في مأزق يهدد الحياة، يمكنك إنقاذ نفسك أو صديقك؟", choiceA: "أنقذ صديقك", choiceB: "أنقذ نفسك" },
        { q: "هل تفضل أن تكون القائد اللامع في المقدمة، أم الجاسوس المتخفي؟", choiceA: "الجاسوس", choiceB: "القائد" }
    ];

    function showAlert(msg, isSuccess = false) {
        document.getElementById('alert-msg').innerText = msg;
        document.getElementById('alert-box').className = isSuccess ? "alert-box success" : "alert-box";
        document.getElementById('custom-alert').classList.remove('hidden');
    }

    function closeAlert() { document.getElementById('custom-alert').classList.add('hidden'); }

    function checkLogin() {
        const input = document.getElementById('client-code').value.trim();
        if(input === CONFIG.loginCode) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        } else {
            playBeep(150, 0.3);
            showAlert("فشل الوصول. الرمز غير صحيح");
        }
    }

    function loadQuestion() {
        const qObj = questions[currentQ];
        document.getElementById('question-content').innerText = qObj.q;
        document.getElementById('btn-a').innerText = qObj.choiceA;
        document.getElementById('btn-b').innerText = qObj.choiceB;
    }

    function handleAnswer(choice) {
        if (currentQ === 0) (choice === 'B') ? score++ : score--;
        if (currentQ === 1) (choice === 'A') ? score++ : score--;
        if (currentQ === 2) (choice === 'B') ? score++ : score--;
        currentQ++;
        if(currentQ < questions.length) loadQuestion(); else showFinalResult();
    }

    function showFinalResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        if(score > 0) {
            document.getElementById('role-display').innerText = "دورك: المحرك (The Tactician)";
            document.getElementById('power').innerText = "الشجاعة الميدانية، حماية الحلفاء";
            document.getElementById('weakness').innerText = "الاندفاع العاطفي أحياناً";
        } else {
            document.getElementById('role-display').innerText = "دورك: الظل (The Shadow)";
            document.getElementById('power').innerText = "البقاء، الذكاء التحليلي البارد";
            document.getElementById('weakness').innerText = "تفضيل الذات، الانعزال";
        }
    }

    function showMission() {
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('mission-screen').classList.remove('hidden');
    }

    function verifyMission() {
        const val = document.getElementById('mission-input').value.trim();
        if(val === CONFIG.missionCode) {
            playBeep(800, 0.5);
            showAlert("التاريخ صحيح، نجحت المهمة. بانتظار العملاء الاخرين", true);
        } else {
            playBeep(150, 0.3);
            showAlert("التاريخ خاطئ. عد للموقع وتحقق من اللافتة");
        }
    }
</script>
</body>
</html>
